<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" font-family="Menlo">
  <defs>
    <style>
      .card { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 2; }
      .source { fill: #FFFFFF; stroke: #B45309; stroke-width: 1.5; }
      .source-text { fill: #B45309; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .brand { fill: #1F2328; font-size: 32px; font-weight: 600; letter-spacing: 0.3px; }
      .tagline { fill: #59636E; font-size: 18px; letter-spacing: 0.1px; }
      .title { fill: #1F2328; font-size: 27px; font-weight: 600; letter-spacing: 0.8px; text-anchor: middle; }
      .role { fill: #59636E; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .icon { fill: none; stroke: #1F2328; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .accent-icon { fill: none; stroke: #B45309; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #B45309; stroke-width: 3; marker-end: url(#arrowhead); }
      .collector { fill: none; stroke: #B45309; stroke-width: 1.8; }
      .return { fill: none; stroke: #B45309; stroke-width: 2.4; stroke-dasharray: 9 9; marker-end: url(#arrowhead); }
      .return-label { fill: #B45309; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#B45309"/>
    </marker>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" fill="#8C959F" opacity="0.20"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1500" height="600" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1440" height="540" fill="url(#dot-grid)"/>

  <text x="1092" y="60" class="brand">Fluent</text>
  <text x="1092" y="86" class="tagline">a self-improving software factory</text>

  <!-- Sources become Observations. -->
  <rect x="54" y="47" width="126" height="42" rx="3" class="source"/>
  <rect x="192" y="47" width="142" height="42" rx="3" class="source"/>
  <rect x="346" y="47" width="132" height="42" rx="3" class="source"/>
  <rect x="490" y="47" width="196" height="42" rx="3" class="source"/>
  <text x="117" y="73" class="source-text">AGENT TRACES</text>
  <text x="263" y="73" class="source-text">PRODUCTION LOGS</text>
  <text x="412" y="73" class="source-text">USER FEEDBACK</text>
  <text x="588" y="73" class="source-text">TEAM VISION + IDEAS</text>
  <line x1="117" y1="89" x2="117" y2="131" class="collector"/>
  <line x1="263" y1="89" x2="263" y2="131" class="collector"/>
  <line x1="412" y1="89" x2="412" y2="131" class="collector"/>
  <line x1="588" y1="89" x2="588" y2="131" class="collector"/>
  <line x1="117" y1="131" x2="588" y2="131" class="collector"/>
  <line x1="208" y1="131" x2="208" y2="170" class="flow"/>

  <!-- Main factory flow. -->
  <rect x="58" y="176" width="300" height="190" rx="4" class="card"/>
  <g class="icon">
    <path d="M181 236 Q208 211 235 236 Q208 261 181 236 Z"/>
    <circle cx="208" cy="236" r="7"/>
  </g>
  <text x="208" y="310" class="title">OBSERVATIONS</text>

  <rect x="428" y="176" width="300" height="190" rx="4" class="card"/>
  <g class="icon">
    <path d="M548 207 H586 L599 220 V268 H548 Z"/>
    <path d="M586 207 V220 H599"/>
    <line x1="558" y1="232" x2="586" y2="232"/>
    <line x1="558" y1="244" x2="588" y2="244"/>
    <line x1="558" y1="256" x2="580" y2="256"/>
  </g>
  <text x="578" y="310" class="title">WORK ITEMS</text>

  <rect x="783" y="176" width="370" height="190" rx="4" class="card"/>
  <g class="accent-icon">
    <circle cx="968" cy="232" r="29"/>
    <path d="M968 203 V212"/>
    <path d="M968 252 V261"/>
    <path d="M939 232 H948"/>
    <path d="M988 232 H997"/>
    <path d="M954 219 L961 226 L982 215"/>
    <path d="M954 241 L961 248 L982 237"/>
  </g>
  <text x="968" y="302" class="title">BUILD + REVIEW</text>
  <text x="968" y="335" class="role">WRITER → TESTER → REVIEWERS → LEARNER</text>

  <rect x="1198" y="176" width="244" height="190" rx="4" class="card"/>
  <g class="icon">
    <circle cx="1320" cy="232" r="29"/>
    <path d="M1320 203 C1303 219 1303 245 1320 261"/>
    <path d="M1320 203 C1337 219 1337 245 1320 261"/>
    <line x1="1291" y1="232" x2="1349" y2="232"/>
    <path d="M1297 217 Q1320 226 1343 217"/>
    <path d="M1297 247 Q1320 238 1343 247"/>
  </g>
  <text x="1320" y="302" class="title">WORKING</text>
  <text x="1320" y="337" class="title">SOFTWARE</text>

  <line x1="358" y1="271" x2="425" y2="271" class="flow"/>
  <line x1="728" y1="271" x2="780" y2="271" class="flow"/>
  <line x1="1153" y1="271" x2="1195" y2="271" class="flow"/>

  <!-- Learning changes future work. -->
  <path d="M968 366 V445 H578 V369" class="return"/>
  <text x="773" y="434" class="return-label">EXPERTISE</text>

  <!-- Running software creates new Observations. -->
  <path d="M1320 366 V510 H208 V369" class="return"/>
  <text x="764" y="499" class="return-label">NEW OBSERVATIONS</text>
</svg>
